aid: lantern
name: Lantern
description: >-
  Lantern (legal entity Employer Direct Healthcare, LLC dba Lantern Specialty Care) is a US specialty
  care platform that connects members with high-quality, lower-cost care for surgery, cancer and
  infusion therapy — the complex, high-cost episodes that account for roughly half of healthcare
  spending. Founded in 2011 as SurgeryPlus and later expanded into cancer and infusion care, Lantern
  sells to employers, public-sector employers, labor union trusts, health plans and benefits
  consultants, pairing a hand-selected "Network of Excellence" of specialists with dedicated care
  teams that navigate a member end to end through a treatment journey. Lantern is backed by Insight
  Partners. As of this enrichment pass Lantern publishes no public developer program, API
  documentation, machine-readable specification, SDKs or discovery surface — this profile captures
  its public company, trust and security posture only.
